upstream clickhouse_native {
    server 127.0.0.1:9000;
}

upstream clickhouse_replication {
    server 127.0.0.1:9009;
}

server {
    listen 9440 ssl;
    listen [::]:9440 ssl;
    proxy_pass clickhouse_native;

    proxy_connect_timeout 5s;
    proxy_timeout 30m;

    ssl_certificate /etc/letsencrypt/live/default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/default/privkey.pem;
    ssl_handshake_timeout 10s;
    ssl_session_cache shared:SSL:10m;
}

server {
    listen 9010 ssl;
    listen [::]:9010 ssl;
    proxy_pass clickhouse_replication;

    proxy_connect_timeout 5s;
    proxy_timeout 1h;

    ssl_certificate /etc/letsencrypt/live/default/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/default/privkey.pem;
    ssl_handshake_timeout 10s;
    ssl_session_cache shared:SSL:10m;
}

