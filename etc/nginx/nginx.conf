# daemon  off;
user  nginx;
worker_processes  auto;

error_log  /dev/stderr  notice;
pid        /run/nginx.pid;

load_module modules/ngx_http_js_module.so;
load_module modules/ngx_stream_js_module.so;

events {
    worker_connections  1024;
    # multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" Host: $host';

    access_log  /dev/stdout  main;

    sendfile     on;
    tcp_nopush   on;
    tcp_nodelay  on;

    # keepalive_time  1h;
    keepalive_timeout  65;
    # types_hash_max_size  2048;

    gzip  on;
    gzip_types text/css text/less text/plain text/xml application/xml application/json application/javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_user_agent $block_bots {
        default 0;
        "~*(bot|chatgpt|MegaIndex)" 1;
    }

    map $request_uri $block_tags {
        default 0;
        "~*tags=" 1;
    }

    # $server_name
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_zone $binary_remote_addr zone=req:10m rate=10r/s;
    proxy_cache_path /var/cache/nginx/filestore levels=2:2 keys_zone=filestore:10m max_size=1g inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";
    include /etc/nginx/conf.d/*.conf;
}

stream {
    include /etc/nginx/stream.d/*.conf;
}

