[options]
without_demo = True
addons_path = /var/lib/odoo/addons/19.0/enterprise
data_dir = /var/lib/odoo
admin_passwd = ...
list_db = False
db_name = ...
db_host = /run/postgresql
db_user = odoo
max_cron_threads = 1
workers = 2

limit_time_cpu = 600
limit_time_real = 1200
; limit_time_real_cron = 120
; limit_memory_hard = 0
; limit_memory_soft = 0
; limit_request = 0

; log_level = debug

; server_wide_modules = base, web

http_interface = 127.0.0.1
http_port = 8069
gevent_port = 8072
proxy_mode = True
