service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter, spanmetrics]
    metrics/spanmetrics:
      receivers: [spanmetrics]
      exporters: [prometheus]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8890
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:
      endpoint: "0.0.0.0:13133"
  jaeger_query:
    storage:
      traces: trace_storage
      metrics: metric_storage
  jaeger_storage:
    backends:
      trace_storage:
        memory:
          max_traces: 100000
    metric_backends:
      metric_storage:
        prometheus:
          endpoint: "https://...@prometheus...:443"
          normalize_calls: true
          normalize_duration: true

  #         auth:
  #           authenticator: basicauth/jaegerprom

  # basicauth/jaegerprom:
  #   client_auth:
  #     username: "..."
  #     password: "..."

# import urllib.parse
# encoded = urllib.parse.quote("...")
# print(encoded)

connectors:
  spanmetrics:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: trace_storage
  prometheus:
    endpoint: "0.0.0.0:8888"

