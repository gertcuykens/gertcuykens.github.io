###############################################################################
# Server (UDP 51820)                                                          #
###############################################################################
# /etc/wireguard/wg0.conf
# /usr/local/etc/wireguard/wg0.conf

[Interface]
PrivateKey = <SERVER_PRIVATE_KEY>
Address = 10.0.0.1/24, 10.0.1.1/24
ListenPort = 51820

[Peer]
PublicKey = <CLIENT_PUBLIC_KEY>
AllowedIPs = 10.0.0.2/32

# PostUp = nft add table ip wg-nat; nft add chain ip wg-nat postrouting { type nat hook postrouting priority 100 \; }; nft add rule ip wg-nat postrouting oifname "eth0" masquerade; nft add table ip wg-forward; nft add chain ip wg-forward forward { type filter hook forward priority 0 \; policy accept \; }
# PostDown = nft delete table ip wg-nat; nft delete table ip wg-forward

# PostUp = iptables -A FORWARD -i %i -j ACCEPT; iptables -t nat -A POSTROUTING -o eth0 -j MASQUERADE
# PostDown = iptables -D FORWARD -i %i -j ACCEPT; iptables -t nat -D POSTROUTING -o eth0 -j MASQUERADE

###############################################################################
# Client                                                                      #
###############################################################################
# brew install wireguard-tools
# /opt/homebrew/etc/wireguard/wg0.conf

[Interface]
PrivateKey = <CLIENT_PRIVATE_KEY>
Address = 10.0.0.2/16
ListenPort = 51820
# DNS = 1.1.1.1
# DNS = 1.0.0.1 
# DNS = 2606:4700:4700::1001

[Peer]
PublicKey = <SERVER_PUBLIC_KEY>
AllowedIPs = 10.0.0.0/16
# AllowedIPs = 0.0.0.0/0, ::/0
Endpoint = <...>:51820
PersistentKeepalive = 25

