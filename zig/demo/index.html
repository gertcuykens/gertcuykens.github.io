<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zig WASM</title>
</head>
<body>
    <h1>Zig WASM</h1>
    <script type="module">
        // zig build-exe math.zig -target wasm32-freestanding -O ReleaseSmall -fno-entry -rdynamic
        // python -m http.server 8080

        // allocating 1 page = 64KB memory.
        // const wasmMemory = new WebAssembly.Memory({ initial: 1 });
        // const wasmTable = new WebAssembly.Table({ initial: 1, element: 'anyfunc' });

        // base offset (0 means start at the beginning)
        const importObject = {
            env: {
                // memory: wasmMemory,
                // __indirect_function_table: wasmTable,
                // __memory_base: 0,
                // __table_base: 0,
                abort: (msg, file, line, col) => {
                    console.error(`${file}:${line}:${col} ${msg}`);
                }
            }
        };

        try {
            const response = await fetch('math.wasm');
            const { instance } = await WebAssembly.instantiateStreaming(response, importObject);
            window.z = instance.exports;
            test(instance.exports)
            console.log("WASM z obj created successfully!", instance.exports);
        } catch (err) {
            console.error("Failed to load WASM:", err);
        }

        async function test(obj) {
            const inputString = "Hello Zig!";

            const encoder = new TextEncoder();
            const stringBytes = encoder.encode(inputString);
            const len = stringBytes.length;

            const ptr = obj.alloc(len);
            if (ptr === 0) {
                console.error("WASM allocation failed!");
                return;
            }

            const wasmMemoryBuffer = new Uint8Array(obj.memory.buffer);
            wasmMemoryBuffer.set(stringBytes, ptr);

            const result = obj.sumStringChars(ptr, len);
            console.log(`Sum of ASCII codes for "${inputString}":`, result);

            obj.free(ptr, len);
        }
    </script>
</body>
</html>
